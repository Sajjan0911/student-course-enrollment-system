<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Course Enrollment System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<aside class="sidebar">
<div class="logo"><h2>🎓 StudentSys</h2></div>
<ul class="menu">
<li class="active"><a href="/"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
<li><a href="/students-page"><i class="bi bi-people-fill"></i> Students</a></li>
<li><a href="/courses-page"><i class="bi bi-book-fill"></i> Courses</a></li>
<li><a href="/enrollments-page"><i class="bi bi-journal-check"></i> Enrollments</a></li>
</ul>
</aside>
<main class="main-content">
<nav class="topbar">
<h3>Dashboard</h3>
<div class="profile d-flex align-items-center gap-3">
<img th:if="${picture != null}" th:src="${picture}" alt="Profile" width="45" height="45" class="rounded-circle">
<div>
<strong th:text="${name}">User</strong><br>
<small th:text="${email}">Email</small>
</div>
<form th:action="@{/logout}" method="post">
<button class="btn btn-danger btn-sm"><i class="bi bi-box-arrow-right"></i> Logout</button>
</form>
</div>
</nav>
<section class="welcome">
<h1>Student Course Enrollment System</h1>
<p>Manage students, courses and enrollments from one dashboard.</p>
</section>
<div class="cards">
<a href="/students-page" class="text-decoration-none"><div class="card students"><i class="bi bi-people-fill"></i><h3>Students</h3><h1 id="studentCount">0</h1></div></a>
<a href="/courses-page" class="text-decoration-none"><div class="card courses"><i class="bi bi-book-fill"></i><h3>Courses</h3><h1 id="courseCount">0</h1></div></a>
<a href="/enrollments-page" class="text-decoration-none"><div class="card enrollments"><i class="bi bi-journal-check"></i><h3>Enrollments</h3><h1 id="enrollmentCount">0</h1></div></a>
</div>
<div class="card shadow mt-4 p-4">
<h4 class="mb-4">📊 Dashboard Analytics</h4>
<div style="height:400px;"><canvas id="dashboardChart"></canvas></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
